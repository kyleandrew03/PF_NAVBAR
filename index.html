<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar with Sidebar & Notification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Desktop Navbar -->
    <nav class="navbar">
        <div class="brand">
            <img src="img.png" alt="Car Logo" class="logo">
            <span class="logo-text">Cars</span>
        </div>

        <ul class="nav-links-desktop">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="hamburger" id="hamburger">&#9776;</div>
    </nav>

    <!-- Mobile Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="close-btn" id="closeBtn">&times;</div>
        <ul class="nav-links-mobile">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- Simple inline notification -->
    <div id="pageNotification" class="page-notification"></div>

    <script src="script.js" defer></script>
</body>
</html>
